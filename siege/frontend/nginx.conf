server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fichiers hashés Vite : servir ou 404 réel (jamais index.html).
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html : toujours revalidé pour pointer vers les bons chunks après déploiement.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Routes SPA : fallback uniquement hors /assets/.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
