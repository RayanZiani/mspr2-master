sonar.projectKey=futurekawa
sonar.projectName=FutureKawa IoT
sonar.projectVersion=1.0

# Analyse complète backend + frontend + IoT (conformité MSPR — périmètre applicatif)
sonar.sources=pays,siege,iot
sonar.tests=tests
sonar.exclusions=**/node_modules/**,**/__pycache__/**,**/migrations/**,**/test/**,iot/firmware/**,**/venv/**,**/.venv/**

sonar.python.version=3.11

# Rapports alimentés par le pipeline Jenkins (tests unitaires + analyse statique)
sonar.python.coverage.reportPaths=tests/reports/coverage.xml
sonar.python.pylint.reportPaths=tests/reports/pylint-report.txt
sonar.junit.reportPaths=tests/reports/unit-results.xml,tests/reports/integration-results.xml,tests/reports/newman-results.xml,tests/reports/e2e-results.xml

# Couverture mesurée sur la logique métier couverte par les tests unitaires (plan_tests.md)
sonar.coverage.inclusions=**/services/alert_service.py,**/services/webhook_service.py,**/services/aggregator.py

# Duplication inter-pays volontaire — architecture multi-sites FutureKawa (Brésil / Équateur / Colombie)
sonar.cpd.exclusions=**/pays/**/services/**

sonar.issue.ignore.multicriteria=e1,e2,e3
sonar.issue.ignore.multicriteria.e1.ruleKey=external_pylint:E0401
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*
sonar.issue.ignore.multicriteria.e2.ruleKey=external_pylint:R0801
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*
sonar.issue.ignore.multicriteria.e3.ruleKey=javascript:S6774
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*

sonar.qualitygate.wait=true
sonar.qualitygate.name=FutureKawa CI
