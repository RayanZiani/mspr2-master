# Mosquitto broker — Brésil
# Topic : futurekawa/bresil/{entrepot}/sensors

# Listen on the standard MQTT port inside the container
listener 1883

# Allow anonymous for demo; in production, replace with password file
allow_anonymous true

# Persistence so messages survive broker restarts (useful for demos)
persistence true
persistence_file mosquitto.db
persistence_location /mosquitto/data/

# Log to stdout for docker-friendly logs
log_type all
log_dest stdout

# Limits and tuning (kept conservative)
max_inflight_messages 20
