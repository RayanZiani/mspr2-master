services:
  mosquitto-colombie:
    image: eclipse-mosquitto:2
    container_name: mosquitto-colombie
    volumes:
      - ./broker/mosquitto.conf:/mosquitto/config/mosquitto.conf
    ports:
      - "1885:1883"
    networks:
      - colombie-net

  mysql-colombie:
    image: mysql:8.0
    container_name: mysql-colombie
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-colombie-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - colombie-net

  api-colombie:
    build: ./api
    container_name: api-colombie
    env_file: .env
    ports:
      - "8003:8000"
    depends_on:
      mysql-colombie:
        condition: service_healthy
      mosquitto-colombie:
        condition: service_started
    restart: unless-stopped
    networks:
      - colombie-net

  node-red-colombie:
    image: nodered/node-red:latest
    container_name: node-red-colombie
    volumes:
      - ./node-red/flows.json:/data/flows.json
    ports:
      - "1882:1880"
    depends_on:
      - mosquitto-colombie
    networks:
      - colombie-net

  simulator-colombie:
    build: ../../iot/simulator
    container_name: simulator-colombie
    environment:
      PAYS: colombie
      MQTT_BROKER_HOST: mosquitto-colombie
      MQTT_BROKER_PORT: "1883"
      SIMULATE_INTERVAL: "30"
    depends_on:
      - mosquitto-colombie
    networks:
      - colombie-net
    restart: unless-stopped

volumes:
  mysql-colombie-data:

networks:
  colombie-net:
    driver: bridge
